<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/enowap/mediasaver/main/logo.png">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/enowap/mediasaver/main/logo.png">
  <meta name="theme-color" content="#0a002b">
  <title>gemini prompt maker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---------- reset & base ---------- */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #0f0f1a, #1a0033);
      color: #eee;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      position: relative;
      overflow-x: hidden;
      font-size: 14px;
      line-height: 1.6;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 20% 80%, rgba(0,255,180,0.1), transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(0,200,255,0.1), transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    /* ---------- header ---------- */
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo {
      width: 45px; height: 45px;
      background: linear-gradient(45deg, #00ffb3, #00ddff);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      box-shadow: 0 0 15px rgba(0,255,179,.5);
      animation: pulse 2s infinite;
    }
    .logo svg {
        width: 24px;
        height: 24px;
        color: #000;
    }
    @keyframes pulse {
      0%,100% {box-shadow: 0 0 15px rgba(0,255,179,.5);}
      50% {box-shadow: 0 0 25px rgba(0,255,179,.8);}
    }
    h1 {
      font-size: 1.8rem;
      color: #00ffb3;
      text-shadow: 0 0 8px rgba(0,255,179,.3);
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #aaa;
    }

    /* ---------- container ---------- */
    .container {
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 18px;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(0,0,0,.3),
                 0 0 30px rgba(0,255,153,.15);
      border: 1px solid rgba(0,255,153,.2);
      flex-grow: 1;
    }

    /* ---------- upload box ---------- */
    .upload-box {
      margin-top: 15px;
      padding: 18px;
      border: 2px dashed #444;
      border-radius: 14px;
      background: #1a1a1a;
      text-align: center;
      cursor: pointer;
      transition: all .3s ease;
      position: relative;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }
    .upload-box:hover {
      border-color: #00ffaa;
      background: rgba(0,255,153,.08);
      transform: translateY(-2px);
    }
    .upload-box.dragover {
      border-color: #00ffb3;
      background: rgba(0,255,153,.15);
      transform: scale(1.02);
    }
    .upload-box svg {
      width: 32px;
      height: 32px;
      margin-bottom: 8px;
      color: #00ffaa;
    }
    .upload-label {
      color: #00ffaa;
      display: block;
      margin-top: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* ---------- preview ---------- */
    .preview-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 15px 0;
      height: 280px;
    }
    .preview-image {
      width: auto;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,255,120,.3);
      border: 1px solid #333;
      transition: transform .2s;
    }
    .preview-image:hover {
      transform: scale(1.03);
    }
    .remove-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255,50,50,.95);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 28px; height: 28px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      z-index: 10;
    }
    .remove-btn:hover {
      background: #ff0000;
      transform: scale(1.1);
    }

    /* ---------- options (kecil & rapi) ---------- */
    .options-wrapper {
      margin: 18px auto;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .option-group h3 {
      font-size: 1rem;
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
      font-weight: 600;
    }

    .option-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 10px;
    }

    .option-card {
      position: relative;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      min-height: 52px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .option-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0, 255, 179, 0.12), transparent);
      opacity: 0;
      transition: opacity 0.25s ease;
      border-radius: 12px;
      pointer-events: none;
    }

    .option-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 255, 179, 0.18);
      border-color: #00ffaa;
    }

    .option-card:hover::before {
      opacity: 1;
    }

    .option-card input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
    }

    .option-card .icon {
      font-size: 1.1rem;
      transition: all 0.25s ease;
      display: block;
    }

    .option-card .label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #cbd5e1;
      transition: all 0.25s ease;
      display: block;
    }

    .option-card input[type="radio"]:checked + .icon,
    .option-card input[type="radio"]:checked + .icon + .label {
      color: #00ffaa;
      text-shadow: 0 0 6px rgba(0, 255, 170, 0.4);
    }

    .option-card input[type="radio"]:checked {
      border-color: #00ffaa;
      box-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
    }
    .option-card input[type="radio"]:checked + .icon + .label + .checkmark {
      display: block;
      position: absolute;
      top: 5px; right: 5px;
      width: 15px; height: 15px;
      background-color: #00ffaa;
      border-radius: 50%;
      content: '✓';
      font-size: 10px;
      color: #000;
      line-height: 15px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    /* --- Spinner untuk button --- */
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 3px solid #fff;
      width: 1em;
      height: 1em;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ---------- button ---------- */
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: linear-gradient(45deg,#00ffaa,#00dd99);
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all .3s ease;
      box-shadow: 0 4px 12px rgba(0,255,170,.3);
      position: relative;
      overflow: hidden;
    }
    button::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
      transition: .6s;
    }
    button:hover::before {
      left: 100%;
    }
    button:hover {
      background: linear-gradient(45deg,#00dd99,#00cc88);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,255,170,.4);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      box-shadow: none;
    }
    button:disabled:hover::before {
      left: -100%;
    }


    /* ---------- output ---------- */
    pre {
      background: #000;
      color: #0f0;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 100px;
      font-size: 0.85rem;
      line-height: 1.5;
      border: 1px solid #333;
      box-shadow: inset 0 0 12px rgba(0,255,0,.1);
      cursor: pointer;
      transition: .2s;
      overflow-y: auto;
      max-height: 300px;
    }
    pre:hover {
      box-shadow: inset 0 0 16px rgba(0,255,0,.2);
      background: #111;
    }

    /* ---------- toast ---------- */
    #toast {
      visibility: hidden;
      min-width: 180px;
      background: #00ffae;
      color: #000;
      text-align: center;
      border-radius: 10px;
      padding: 10px 15px;
      position: fixed;
      z-index: 9999;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 600;
      box-shadow: 0 3px 15px rgba(0,255,150,.6);
      opacity: 0;
      transition: opacity .3s ease, top .3s ease, visibility .3s ease;
      top: 25px;
    }
    #toast.show {
      visibility: visible;
      opacity: 1;
    }

    /* ---------- footer ---------- */
    footer {
      text-align: center;
      margin-top: 30px;
      color: #666;
      font-size: 0.8rem;
    }
    footer a {
      color: #00ffaa;
      text-decoration: none;
      font-weight: 500;
    }
    footer a:hover {
      text-decoration: underline;
    }

    /* ---------- responsive adjustments ---------- */
    @media (max-width: 480px) {
      h1 {
        font-size: 1.5rem;
      }
      .subtitle {
        font-size: 0.8rem;
      }
      .container {
        padding: 18px;
        border-radius: 15px;
      }
      .option-cards {
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      }
      .option-card .label {
        font-size: 0.7rem;
      }
      .remove-btn {
        right: 15px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           style="cursor:pointer; transition:transform 0.2s ease;"
           onclick="location.reload()"
           onmouseover="this.style.transform='rotate(10deg)'"
           onmouseout="this.style.transform='rotate(0deg)'"
           title="Klik untuk memuat ulang halaman">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.82-4M22 12.5a10 10 0 0 1-18.82 4"/>
      </svg>
    </div>
    <h1>gemini prompt maker</h1>
    <p class="subtitle">ubah gambar menjadi prompt ai dengan detail maksimal</p>
  </header>

  <div class="container">

    <textarea id="prompt-template" style="display:none;">
ubahlah gambar yang saya kirim menjadi deskripsi teks yang sangat detail dan realistis.
pastikan hasil output menggambarkan dengan akurat setiap elemen penting dari gambar, termasuk:
- posisi tubuh dan arah pandangan subjek.
- postur dan ekspresi wajah.
- fitur wajah (mata, hidung, mulut, rambut, dll.).
- pakaian, warna, dan tekstur.
- pencahayaan, latar belakang, serta suasana atau mood gambar.

hasilkan output akhir dalam format {format_placeholder} yang valid, dengan struktur yang dapat digunakan langsung sebagai prompt untuk ai image generation.
jangan tambahkan teks lain di luar {format_placeholder}, cukup keluarkan isi {format_placeholder}-nya saja.
    </textarea>

    <div class="upload-box" id="dropzone">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image-up"><path d="M12 6V2"/><path d="M12 18V14"/><path d="M16 16 12 12 8 16"/><line x1="12" x2="12" y1="12" y2="21"/></svg>
      <span>seret & lepaskan gambar di sini</span>
      <label for="image" class="upload-label">atau klik untuk memilih file</label>
      <input type="file" id="image" accept="image/*" style="display:none;">
    </div>

    <div class="preview-container" id="previewContainer" style="display:none;"> <button class="remove-btn" id="removeBtn" aria-label="hapus gambar">×</button> <img id="previewImage" class="preview-image" alt="pratinjau gambar"> </div>

    <div class="options-wrapper">
      <div class="option-group">
        <h3>tipe prompt:</h3>
        <div class="option-cards" id="type-options">
          <label class="option-card">
            <input type="radio" name="type" value="general" checked>
            <span class="icon">📝</span>
            <span class="label">general</span>
          </label>
          <label class="option-card">
            <input type="radio" name="type" value="design">
            <span class="icon">🌐</span>
            <span class="label">web design</span>
          </label>
          <label class="option-card">
            <input type="radio" name="type" value="bug">
            <span class="icon">🐛</span>
            <span class="label">bug / error</span>
          </label>
        </div>
      </div>

      <div class="option-group">
        <h3>format output:</h3>
        <div class="option-cards" id="format-options">
          <label class="option-card" data-format="json">
            <input type="radio" name="format" value="json" checked>
            <span class="icon">{}</span>
            <span class="label">json</span>
          </label>
          <label class="option-card" data-format="text">
            <input type="radio" name="format" value="text">
            <span class="icon">📄</span>
            <span class="label">teks</span>
          </label>
          <label class="option-card" data-format="html">
            <input type="radio" name="format" value="html">
            <span class="icon">&lt;/&gt;</span>
            <span class="label">css+html</span>
          </label>
          <label class="option-card" data-format="css">
            <input type="radio" name="format" value="css">
            <span class="icon">css</span>
            <span class="label">tailwind template</span>
          </label>
        </div>
      </div>
    </div>

    <button id="generateBtn">generate prompt</button>

    <div style="text-align:center;">
      <pre id="output" title="klik untuk menyalin hasil" style="
        background:#111;
        color:#00ffcc;
        padding:15px;
        border-radius:8px;
        white-space:pre-wrap;
        font-family:'JetBrains Mono', monospace;
        line-height:1.6;
        text-align:left;
        max-width:90%;
        margin:auto;
        overflow:auto;
      ">hasil akan muncul di sini...</pre>
    </div>

    <div id="donate" style="text-align:center; margin:35px auto 20px; max-width:380px; background:rgba(0,0,0,0.2); border-radius:12px; padding:12px; box-shadow:0 0 10px rgba(0,255,120,0.05);">
      <h2 style="font-weight:600; color:#e0e0e0; font-size:14px; margin-bottom:10px;">donasi & dukungan:</h2>
      <div style="display:flex; justify-content:center; gap:25px;">
        <a href="https://link.dana.id/minta?full_url=https://qr.dana.id/v1/281012012021100712289849" target="_blank"
           style="transition:transform .25s;" onmouseover="this.style.transform='scale(1.15)'" onmouseout="this.style.transform='scale(1)'">
          <img src="https://raw.githubusercontent.com/enowap/mediasaver/main/dana.jpg" alt="dana"
               style="width:38px; height:38px; border-radius:50%; background:#0a0a0a; padding:5px; box-shadow:0 0 10px rgba(0,255,180,0.3);">
        </a>
        <a href="https://www.facebook.com/daff.sensen" target="_blank"
           style="transition:transform .25s;" onmouseover="this.style.transform='scale(1.15)'" onmouseout="this.style.transform='scale(1)'">
           <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Facebook_Logo.png" alt="facebook"
               style="width:38px; height:38px; border-radius:50%; background:#0a0a0a; padding:5px; box-shadow:0 0 10px rgba(0,255,180,0.3);">
        </a>
      </div>
    </div>

    <div id="toast">teks berhasil disalin!</div>
  </div>

  <footer>
    <p>dibuat dengan ❤️ menggunakan <a href="https://gemini.google.com" target="_blank">gemini api</a> • © 2025</p>
  </footer>

<div style="text-align:center; margin-top:10px;">
  <div id="hits-container" style="
    display:inline-block;
    background:#111;
    color:#00ffcc;
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    border-radius:10px;
    padding:10px 20px;
    box-shadow:0 0 10px rgba(0,255,204,0.3);
  ">
    <div style="font-size:12px; color:#aaa;">Total Kunjungan</div>
    <div id="hits-count" style="font-size:22px; font-weight:bold; margin-top:5px;">--</div>
  </div>
</div>
  
    <script>
async function loadHits() {
  try {
    const res = await fetch("https://raw.githubusercontent.com/nitrogen68/Gemini-lab/main/data/hits.json?" + Date.now());
    if (!res.ok) throw new Error("Gagal memuat data hits");
    const data = await res.json();
    document.getElementById("hits-count").textContent = data.hits || 0;
  } catch (err) {
    console.error(err);
    document.getElementById("hits-count").textContent = "0";
  }
}

// panggil fungsi saat halaman dibuka
loadHits();

      
    // --- Helper function for getting elements by ID (case-sensitive fix) ---
    function getElementByIdFixed(id) {
        const element = document.getElementById(id);
        if (!element) {
            console.warn(`Element with ID '${id}' not found.`);
        }
        return element;
    }

    const toast = getElementByIdFixed('toast');
    const output = getElementByIdFixed('output');
    const previewImage = getElementByIdFixed('previewImage');
    const promptTemplate = getElementByIdFixed('prompt-template');
    const fileInput = getElementByIdFixed('image');
    const previewContainer = getElementByIdFixed('previewContainer');
    const removeBtn = getElementByIdFixed('removeBtn');
    const dropzone = getElementByIdFixed('dropzone');
    const generateBtn = getElementByIdFixed('generateBtn');
    const donateSection = getElementByIdFixed('donate');

    let currentFile = null; // menyimpan file yang diunggah
    let ketikIlustrasiTimeout; // Simpan ID timeout agar bisa dihentikan

    // === VARIABEL GLOBAL UNTUK FORMAT OTOMATIS ===
    let rawJson = ""; // Menyimpan hasil mentah yang bersih setelah pemrosesan

    // === logika hide/show format output ===
    const typeRadios = document.querySelectorAll('input[name="type"]');
    const formatOptionsWrapper = getElementByIdFixed('format-options');
    const formatCards = formatOptionsWrapper.querySelectorAll('.option-card');
    const formatRadios = formatOptionsWrapper.querySelectorAll('input[name="format"]');
    
    // reset isi awal
    output.textContent = "";

    // daftar ilustrasi teks
    const ilustrasiList = [
      '💡 Unggah gambar untuk menghasilkan deskripsi detail secara otomatis...',
      '🐞 Kirim tangkapan layar error untuk mendeteksi penyebab dan solusinya...',
      '🎨 Upload potongan desainmu dan ubah menjadi potongan kode website siap pakai...'
    ];

    // variabel global untuk kontrol urutan dan karakter
    let index = 0;
    let charIndex = 0;
    let isTypingActive = false;

    function ketikIlustrasi() {
      if (currentFile) return; // Jangan jalankan jika sudah ada file
      
      isTypingActive = true;
      clearTimeout(ketikIlustrasiTimeout); // Pastikan timeout sebelumnya dihentikan

      if (charIndex < ilustrasiList[index].length) {
        output.textContent += ilustrasiList[index].charAt(charIndex);
        charIndex++;
        ketikIlustrasiTimeout = setTimeout(ketikIlustrasi, 60);
      } else {
        ketikIlustrasiTimeout = setTimeout(() => {
          output.textContent = "";
          index = (index + 1) % ilustrasiList.length;
          charIndex = 0;
          ketikIlustrasi();
        }, 2000);
      }
    }

    function stopKetikIlustrasi() {
      clearTimeout(ketikIlustrasiTimeout);
      isTypingActive = false;
    }
    
    // jalankan animasi
    ketikIlustrasi();

    function updateFormatVisibility() {
      const selectedType = document.querySelector('input[name="type"]:checked')?.value || 'general';

      formatCards.forEach(card => {
        const format = card.dataset.format;
        const input = card.querySelector('input');

        card.classList.add('hidden');
        input.checked = false; 

        if (selectedType === 'general') {
          if (['json', 'text'].includes(format)) {
            card.classList.remove('hidden');
            if (format === 'json') input.checked = true; // default ke json
          }
        } else if (selectedType === 'design') {
          if (['html', 'css'].includes(format)) {
            card.classList.remove('hidden');
            if (format === 'html') input.checked = true; // default ke html
          }
        } else if (selectedType === 'bug') {
          if (['text'].includes(format)) {
            card.classList.remove('hidden');
            if (format === 'text') input.checked = true; // default ke text
          }
        }
      });
    }

    // jalankan saat load & saat ganti type
    typeRadios.forEach(radio => radio.addEventListener('change', () => {
        updateFormatVisibility();
        // Reset output hanya jika hasil belum ada (rawJson kosong)
        if (!rawJson) {
            output.textContent = 'hasil akan muncul di sini...';
            stopKetikIlustrasi(); // Stop saat ganti type, siap untuk generate
        }
    })); 
    updateFormatVisibility();

    
    // === toast & copy ===
    function showToast(message) {
      toast.textContent = message;
      toast.style.top = `${window.scrollY + 25}px`;
      toast.classList.add('show');
      clearTimeout(toast.hideTimeout);
      toast.hideTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // Fungsi otomatis ubah JSON ke teks biasa
    function autoJsonToText(input) {
      const clean = input.trim();
      const isJsonLike = /^\s*\{[\s\S]*\}\s*$/.test(clean);

      if (isJsonLike) {
        try {
          const data = JSON.parse(clean);
          const keys = Object.keys(data);
          let resultText = '';
          keys.forEach((key, i) => {
            if (typeof data[key] === 'string') {
              resultText += (i > 0 ? '\n\n' : '') +
                            `-- ${key.toUpperCase()} --\n` +
                            data[key].trim();
            }
          });
          return resultText || '⚠️ Tidak ada teks yang dapat diubah dari JSON.';
        } catch {
          return input;
        }
      } else {
        return input;
      }
    }

    // Event handler tombol format yang diperbarui
    function updateFormat(format) {
      // Jika rawJson belum ada, biarkan animasi text typing berjalan normal
      if (!rawJson) {
        if (!isTypingActive) {
            ketikIlustrasi(); // Mulai lagi jika dihentikan karena upload lalu dihapus
        }
        return; 
      }

      // Jika rawJson sudah ada, terapkan logika format
      if (format === 'json') {
        output.textContent = rawJson;
      }
      else if (format === 'text') {
        output.textContent = autoJsonToText(rawJson);
      }
      else {
        // Untuk format non-general (html, css), pertahankan hasil asli
        output.textContent = rawJson; 
      }
    }

    window.addEventListener('scroll', () => {
      if (toast.classList.contains('show')) {
        toast.style.top = `${window.scrollY + 25}px`;
      }
    });

    output.addEventListener('click', async () => {
      const text = output.textContent.trim();
      if (!text || text === "hasil akan muncul di sini..." || text === "memproses gambar, mohon tunggu...") return;
      try {
        await navigator.clipboard.writeText(text);
        showToast("teks berhasil disalin!");
      } catch (err) {
        console.error("gagal menyalin teks:", err);
        showToast("gagal menyalin teks!");
      }
    });

    // === upload & preview ===
    function showPreview(file) {
      stopKetikIlustrasi(); // Hentikan animasi saat file di-upload
      output.textContent = 'hasil akan muncul di sini...'; // Reset output sebelum proses

      if (!file || !file.type.startsWith('image/')) {
        showToast('file yang diunggah harus berupa gambar.');
        return;
      }
      if (file.size > 3 * 1024 * 1024) { // batas 3mb
        showToast('ukuran gambar maksimal 3mb.');
        return;
      }

      currentFile = file; // simpan file yang valid
      rawJson = ""; // Reset hasil lama saat upload baru
      const reader = new FileReader();
      reader.onload = e => {
        previewImage.src = e.target.result;
        previewContainer.style.display = 'flex';
        dropzone.style.display = 'none';
        donateSection.style.display = 'block';
      };
      reader.onerror = () => showToast('gagal membaca file gambar.');
      reader.readAsDataURL(file);
    }

    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const file = e.dataTransfer?.files[0];
      if (file) {
        fileInput.files = e.dataTransfer.files;
        showPreview(file);
      }
    });

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) showPreview(file);
    });

    removeBtn.addEventListener('click', () => {
      previewContainer.style.display = 'none';
      previewImage.src = '';
      fileInput.value = '';
      currentFile = null;
      rawJson = ""; // Reset hasil
      dropzone.style.display = 'flex';
      output.textContent = 'hasil akan muncul di sini...';
      donateSection.style.display = 'block';
      ketikIlustrasi(); // Mulai animasi lagi setelah menghapus gambar
    });
    
    // Tambahkan fungsi untuk mengontrol status radio button
    function setOptionsEnabled(enabled) {
      typeRadios.forEach(radio => radio.disabled = !enabled);
      formatRadios.forEach(radio => radio.disabled = !enabled);
      // Kontrol kursor dan tampilan pada card agar sesuai
      document.querySelectorAll('.option-card').forEach(card => {
        card.style.cursor = enabled ? 'pointer' : 'not-allowed';
        card.style.opacity = enabled ? '1' : '0.6';
        card.style.transform = 'none'; // Hilangkan efek hover saat disabled
      });
    }

    // === send prompt (Logika Final Diperbaiki) ===
    generateBtn.addEventListener('click', async () => {
      if (!currentFile) {
        output.textContent = 'mohon unggah gambar terlebih dahulu.';
        return;
      }

      const selectedType = document.querySelector('input[name="type"]:checked');
      const selectedFormat = document.querySelector('input[name="format"]:checked');

      if (!selectedType || !selectedFormat) {
        output.textContent = 'mohon pilih tipe prompt dan format output.';
        return;
      }

      // 1. Tampilkan spinner, nonaktifkan tombol generate
      generateBtn.disabled = true;
      generateBtn.innerHTML = '<span class="spinner"></span> Memproses...';
      output.textContent = 'memproses gambar, mohon tunggu...';
      donateSection.style.display = 'none';
      
      // 2. Nonaktifkan semua radio button (opsi)
      setOptionsEnabled(false); 
      
    try {
    // 1) coba hit counter (tidak fatal jika gagal)
    // === Bagian yang sudah diperbaiki (Hit Counter) ===
    try {
      const hitRes = await fetch('/api/updateHits', {
        method: 'POST',
        // 1. Tambahkan Header Content-Type
        headers: { 'Content-Type': 'application/json' }, 
        // 2. Kirim field data nyata untuk menghindari error 400 di server
        body: JSON.stringify({ slug: 'hit' }) 
      });
      
      if (hitRes.ok) {
        const hitData = await hitRes.json();
        console.log('Hit sukses:', hitData);
        // Opsional: Perbarui tampilan hit count di frontend
        const hitsCountElement = document.getElementById("hits-count");
        if (hitsCountElement) {
            hitsCountElement.textContent = hitData.hits;
        }
      } else {
        // Pesan peringatan yang ditingkatkan untuk debugging
        console.warn('Hit tidak tercatat, status:', hitRes.status, 'Body respons:', await hitRes.text());
      }
    } catch (hitErr) {
      console.warn('Gagal panggil updateHits:', hitErr);
      // jangan throw -> tetap lanjutkan proses utama
    }
// ===================================


       const formData = new FormData();
        let finalPrompt = '';

        // mengambil template prompt dari textarea
        let basePrompt = promptTemplate.value.trim();

        // Logika Prompt berdasarkan Tipe
        if (selectedType.value === 'design') {
          if (selectedFormat.value === 'html') {
            finalPrompt = 'deteksi apakah gambar ini memuat elemen atau desain website. jika ya, buat ulang desain tersebut hanya dalam format css+html murni tanpa teks tambahan. jika tidak ada elemen website yang terdeteksi, balas dengan teks: "maaf, tidak ada desain html atau css yang terdeteksi."';
          } else { // css
            finalPrompt = 'analisis apakah gambar ini berisi tampilan antarmuka atau gaya desain website. jika ya, hasilkan hanya kode berupa tailwind template murni tanpa teks tambahan. jika tidak ada desain ui yang terdetksi, balas dengan teks: "maaf, tidak ada desain html atau css yang terdeteksi."';
          }
        } else if (selectedType.value === 'bug') {
          finalPrompt = 'analisis gambar ini, deteksi jika ada kode error, pesan kesalahan, atau indikasi bug. jelaskan secara singkat penyebabnya dan solusi perbaikannya. jika gambar tidak berisi konteks bug atau error, jawab: "maaf, gambar ini tidak mengandung bug atau error yang dapat dianalisis."';
        } else { // general
          // ganti placeholder {format_placeholder} di prompt template
          const formatText = selectedFormat.value.toUpperCase(); 
          finalPrompt = basePrompt.replace(/{format_placeholder}/g, formatText);
        }

        formData.append('prompt', finalPrompt);
        if (currentFile) {
          formData.append('image', currentFile, currentFile.name);
        } else {
          throw new Error("Tidak ada gambar yang diunggah untuk dikirim.");
        }

        // PERHATIAN: Hapus baris di bawah ini dan uncomment kode fetch saat deploy!
        // =========================================================================
        const res = await fetch('/api/gemini', { method: 'POST', body: formData });
        // =========================================================================

        if (!res.ok) {  
          const errorData = await res.json();  
          throw new Error(errorData.error || `server error: ${res.status}`);
        }  
  
        const data = await res.json();

        let cleanResult = (data.result || data.error || 'Tidak ada hasil.')
          // Hapus blok markdown
          .replace(/```(json|html|css|text|TEXT)?\s*([\s\S]*?)```/gi, '$2')
          // Hapus markup markdown
          .replace(/\*\*(.*?)\*\*/g, '$1')
          .replace(/\*(.*?)\*/g, '$1')
          .replace(/_(.*?)_/g, '$1')
          // Perapihan
          .replace(/([A-Z][A-Za-z ]+):\s*\n/g, '\n\n$1:\n')
          .replace(/^\s*[-*+]\s*/gm, '• ')
          .replace(/^\s*\d+\.\s*/gm, (match) => match.trim() + ' ')
          .replace(/\n{3,}/g, '\n\n')
          .replace(/[ \t]+$/gm, '')
          .trim();


        // 3. Simpan hasil mentah dan tentukan output
        rawJson = cleanResult; 
        
        // Tampilkan hasil berdasarkan format yang sedang terpilih
        if (selectedType.value === 'general') {
            updateFormat(selectedFormat.value); // Panggil updateFormat untuk format general
        } else {
            // Untuk format non-general (design, bug), langsung tampilkan hasil bersih
            output.textContent = rawJson || 'tidak ada hasil.';
        }
        
      } catch (err) {
        console.error("error saat mengirim prompt:", err);
        output.textContent = 'terjadi kesalahan: ' + err.message;
        rawJson = ""; // Pastikan rawJson kosong jika terjadi error
      } finally {
        // 4. Selalu kembalikan tombol & aktifkan opsi
        generateBtn.disabled = false;
        generateBtn.innerHTML = 'Generate Prompt';
        donateSection.style.display = 'block'; 
        setOptionsEnabled(true); // Aktifkan kembali semua radio button
      }
    });
    
    // === EVENT HANDLER UNTUK RADIO FORMAT ===
    formatRadios.forEach(radio => {
      radio.addEventListener('click', () => {
        const selectedFormat = radio.value;
        updateFormat(selectedFormat);
      });
    });

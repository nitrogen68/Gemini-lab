<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/enowap/mediasaver/main/logo.png">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/enowap/mediasaver/main/logo.png">
  <meta name="theme-color" content="#0a002b">
  <title>gemini prompt maker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---------- reset & base ---------- */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #0f0f1a, #1a0033);
      color: #eee;
      font-family: 'Poppins', sans-serif; /* Perbaiki P menjadi Poppins */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      position: relative;
      overflow-x: hidden;
      font-size: 14px;
      line-height: 1.6;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 20% 80%, rgba(0,255,180,0.1), transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(0,200,255,0.1), transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    /* ---------- header ---------- */
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo {
      width: 45px; height: 45px;
      background: linear-gradient(45deg, #00ffb3, #00ddff);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      box-shadow: 0 0 15px rgba(0,255,179,.5);
      animation: pulse 2s infinite;
    }
    .logo svg {
        width: 24px;
        height: 24px;
        color: #000; /* warna ikon svg */
    }
    @keyframes pulse { /* Tambahkan @ untuk keyframes */
      0%,100% {box-shadow: 0 0 15px rgba(0,255,179,.5);}
      50% {box-shadow: 0 0 25px rgba(0,255,179,.8);}
    }
    h1 {
      font-size: 1.8rem; /* sedikit lebih besar */
      color: #00ffb3;
      text-shadow: 0 0 8px rgba(0,255,179,.3);
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.9rem; /* sedikit lebih besar */
      color: #aaa;
    }

    /* ---------- container ---------- */
    .container {
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 18px;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(0,0,0,.3),
                 0 0 30px rgba(0,255,153,.15);
      border: 1px solid rgba(0,255,153,.2);
      flex-grow: 1;
    }

    /* ---------- upload box ---------- */
    .upload-box {
      margin-top: 15px;
      padding: 18px;
      border: 2px dashed #444;
      border-radius: 14px;
      background: #1a1a1a;
      text-align: center;
      cursor: pointer;
      transition: all .3s ease;
      position: relative;
      font-size: 0.9rem;
      display: flex; /* untuk tata letak ikon dan teks */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px; /* tinggi minimum */
    }
    .upload-box:hover {
      border-color: #00ffaa;
      background: rgba(0,255,153,.08);
      transform: translateY(-2px); /* Perbaiki translatey menjadi translateY */
    }
    .upload-box.dragover {
      border-color: #00ffb3;
      background: rgba(0,255,153,.15);
      transform: scale(1.02);
    }
    .upload-box svg {
      width: 32px;
      height: 32px;
      margin-bottom: 8px;
      color: #00ffaa;
    }
    .upload-label {
      color: #00ffaa;
      display: block;
      margin-top: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* ---------- preview ---------- */
    .preview-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 15px 0;
      height: 280px; /* menjaga tinggi konsisten */
    }
    .preview-image {
      width: auto;
      height: 100%; /* mengisi tinggi container */
      max-width: 100%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,255,120,.3);
      border: 1px solid #333;
      transition: transform .2s;
    }
    .preview-image:hover {
      transform: scale(1.03);
    }
    .remove-btn {
      position: absolute;
      top: 5px;
      right: 5px; /* posisikan di kanan atas preview container */
      background: rgba(255,50,50,.95);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 28px; height: 28px; /* sedikit lebih besar */
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      z-index: 10; /* pastikan di atas gambar */
    }
    .remove-btn:hover {
      background: #ff0000;
      transform: scale(1.1);
    }

    /* ---------- options (kecil & rapi) ---------- */
    .options-wrapper {
      margin: 18px auto;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .option-group h3 {
      font-size: 1rem;
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
      font-weight: 600;
    }

    .option-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 10px;
    }

    .option-card {
      position: relative;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      min-height: 52px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .option-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0, 255, 179, 0.12), transparent);
      opacity: 0;
      transition: opacity 0.25s ease;
      border-radius: 12px;
      pointer-events: none;
    }

    .option-card:hover {
      transform: translateY(-2px); /* Perbaiki translatey menjadi translateY */
      box-shadow: 0 6px 14px rgba(0, 255, 179, 0.18);
      border-color: #00ffaa;
    }

    .option-card:hover::before {
      opacity: 1;
    }

    .option-card input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
    }

    .option-card .icon {
      font-size: 1.1rem;
      transition: all 0.25s ease;
      display: block; /* agar icon dan label di baris berbeda */
    }

    .option-card .label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #cbd5e1;
      transition: all 0.25s ease;
      display: block; /* agar icon dan label di baris berbeda */
    }

    .option-card input[type="radio"]:checked + .icon,
    .option-card input[type="radio"]:checked + .icon + .label {
      color: #00ffaa;
      text-shadow: 0 0 6px rgba(0, 255, 170, 0.4);
    }

    .option-card input[type="radio"]:checked {
      /* tidak perlu ::before di sini, karena pseudo-element sudah di parent .option-card */
      /* cukup atur visual feedback pada parent */
      border-color: #00ffaa; /* border aktif */
      box-shadow: 0 0 10px rgba(0, 255, 170, 0.5); /* shadow aktif */
    }
    .option-card input[type="radio"]:checked + .icon + .label + .checkmark {
      /* ini placeholder untuk checkmark, jika ingin */
      display: block;
      position: absolute;
      top: 5px; right: 5px;
      width: 15px; height: 15px;
      background-color: #00ffaa;
      border-radius: 50%;
      content: '✓';
      font-size: 10px;
      color: #000;
      line-height: 15px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    /* --- Spinner untuk button --- */
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 3px solid #fff;
      width: 1em; /* Ukuran relatif terhadap font-size tombol */
      height: 1em;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ---------- button ---------- */
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px; /* margin lebih besar */
      background: linear-gradient(45deg,#00ffaa,#00dd99);
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all .3s ease;
      box-shadow: 0 4px 12px rgba(0,255,170,.3);
      position: relative;
      overflow: hidden;
    }
    button::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
      transition: .6s;
    }
    button:hover::before {
      left: 100%;
    }
    button:hover {
      background: linear-gradient(45deg,#00dd99,#00cc88);
      transform: translateY(-2px); /* Perbaiki translatey menjadi translateY */
      box-shadow: 0 6px 16px rgba(0,255,170,.4);
    }
    button:active {
      transform: translateY(0); /* Perbaiki translatey menjadi translateY */
    }
    button:disabled { /* Gaya untuk tombol yang dinonaktifkan */
      opacity: 0.7;
      cursor: not-allowed;
      box-shadow: none;
    }
    button:disabled:hover::before {
      left: -100%; /* Hentikan animasi hover */
    }


    /* ---------- output ---------- */
    pre {
      background: #000;
      color: #0f0;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px; /* margin lebih besar */
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 100px; /* tinggi minimum lebih besar */
      font-size: 0.85rem;
      line-height: 1.5; /* line height lebih baik untuk keterbacaan */
      border: 1px solid #333;
      box-shadow: inset 0 0 12px rgba(0,255,0,.1);
      cursor: pointer;
      transition: .2s;
      overflow-y: auto; /* scroll jika konten terlalu panjang */
      max-height: 300px; /* tinggi maksimum */
    }
    pre:hover {
      box-shadow: inset 0 0 16px rgba(0,255,0,.2);
      background: #111;
    }

    /* ---------- toast ---------- */
    #toast {
      visibility: hidden;
      min-width: 180px;
      background: #00ffae;
      color: #000;
      text-align: center;
      border-radius: 10px;
      padding: 10px 15px;
      position: fixed;
      z-index: 9999;
      left: 50%;
      transform: translateX(-50%); /* Perbaiki translatex menjadi translateX */
      font-weight: 600;
      box-shadow: 0 3px 15px rgba(0,255,150,.6);
      opacity: 0;
      transition: opacity .3s ease, top .3s ease, visibility .3s ease;
      top: 25px; /* posisikan lebih ke bawah agar tidak terlalu mepet */
    }
    #toast.show {
      visibility: visible;
      opacity: 1;
    }

    /* ---------- footer ---------- */
    footer {
      text-align: center;
      margin-top: 30px; /* margin lebih besar */
      color: #666;
      font-size: 0.8rem;
    }
    footer a {
      color: #00ffaa;
      text-decoration: none;
      font-weight: 500;
    }
    footer a:hover {
      text-decoration: underline;
    }

    /* ---------- responsive adjustments ---------- */
    @media (max-width: 480px) { /* Tambahkan @ untuk media query */
      h1 {
        font-size: 1.5rem;
      }
      .subtitle {
        font-size: 0.8rem;
      }
      .container {
        padding: 18px;
        border-radius: 15px;
      }
      .option-cards {
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      }
      .option-card .label {
        font-size: 0.7rem;
      }
      .remove-btn {
        right: 15px; /* sesuaikan posisi pada layar kecil */
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           style="cursor:pointer; transition:transform 0.2s ease;"
           onclick="location.reload()"
           onmouseover="this.style.transform='rotate(10deg)'"
           onmouseout="this.style.transform='rotate(0deg)'"
           title="Klik untuk memuat ulang halaman">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.82-4M22 12.5a10 10 0 0 1-18.82 4"/>
      </svg>
    </div>
    <h1>gemini prompt maker</h1>
    <p class="subtitle">ubah gambar menjadi prompt ai dengan detail maksimal</p>
  </header>

  <div class="container">

    <textarea id="prompt-template" style="display:none;">
ubahlah gambar yang saya kirim menjadi deskripsi teks yang sangat detail dan realistis.
pastikan hasil output menggambarkan dengan akurat setiap elemen penting dari gambar, termasuk:
- posisi tubuh dan arah pandangan subjek.
- postur dan ekspresi wajah.
- fitur wajah (mata, hidung, mulut, rambut, dll.).
- pakaian, warna, dan tekstur.
- pencahayaan, latar belakang, serta suasana atau mood gambar.

hasilkan output akhir dalam format {format_placeholder} yang valid, dengan struktur yang dapat digunakan langsung sebagai prompt untuk ai image generation.
jangan tambahkan teks lain di luar {format_placeholder}, cukup keluarkan isi {format_placeholder}-nya saja.
    </textarea>

    <div class="upload-box" id="dropzone">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image-up"><path d="M12 6V2"/><path d="M12 18V14"/><path d="M16 16 12 12 8 16"/><line x1="12" x2="12" y1="12" y2="21"/></svg>
      <span>seret & lepaskan gambar di sini</span>
      <label for="image" class="upload-label">atau klik untuk memilih file</label>
      <input type="file" id="image" accept="image/*" style="display:none;">
    </div>

    <div class="preview-container" id="previewContainer" style="display:none;"> <button class="remove-btn" id="removeBtn" aria-label="hapus gambar">×</button> <img id="previewImage" class="preview-image" alt="pratinjau gambar"> </div>

    <div class="options-wrapper">
      <div class="option-group">
        <h3>tipe prompt:</h3>
        <div class="option-cards" id="type-options">
          <label class="option-card">
            <input type="radio" name="type" value="general" checked>
            <span class="icon">📝</span>
            <span class="label">general</span>
          </label>
          <label class="option-card">
            <input type="radio" name="type" value="design">
            <span class="icon">🌐</span>
            <span class="label">web design</span>
          </label>
          <label class="option-card">
            <input type="radio" name="type" value="bug">
            <span class="icon">🐛</span>
            <span class="label">bug / error</span>
          </label>
        </div>
      </div>

      <div class="option-group">
        <h3>format output:</h3>
        <div class="option-cards" id="format-options">
          <label class="option-card" data-format="json">
            <input type="radio" name="format" value="json" checked>
            <span class="icon">{}</span>
            <span class="label">json</span>
          </label>
          <label class="option-card" data-format="text">
            <input type="radio" name="format" value="text">
            <span class="icon">📄</span>
            <span class="label">teks</span>
          </label>
          <label class="option-card" data-format="html">
            <input type="radio" name="format" value="html">
            <span class="icon">&lt;/&gt;</span>
            <span class="label">css+html</span>
          </label>
          <label class="option-card" data-format="css">
            <input type="radio" name="format" value="css">
            <span class="icon">css</span>
            <span class="label">tailwind template</span>
          </label>
        </div>
      </div>
    </div>

    <button id="generateBtn">generate prompt</button> <div style="text-align:center;">
      <pre id="output" title="klik untuk menyalin hasil">hasil akan muncul di sini...</pre>
    </div>

    <div id="donate" style="text-align:center; margin:35px auto 20px; max-width:380px; background:rgba(0,0,0,0.2); border-radius:12px; padding:12px; box-shadow:0 0 10px rgba(0,255,120,0.05);">
      <h2 style="font-weight:600; color:#e0e0e0; font-size:14px; margin-bottom:10px;">donasi & dukungan:</h2>
      <div style="display:flex; justify-content:center; gap:25px;">
        <a href="https://link.dana.id/minta?full_url=https://qr.dana.id/v1/281012012021100712289849" target="_blank"
           style="transition:transform .25s;" onmouseover="this.style.transform='scale(1.15)'" onmouseout="this.style.transform='scale(1)'">
          <img src="https://raw.githubusercontent.com/enowap/mediasaver/main/dana.jpg" alt="dana"
               style="width:38px; height:38px; border-radius:50%; background:#0a0a0a; padding:5px; box-shadow:0 0 10px rgba(0,255,180,0.3);">
        </a>
        <a href="https://www.facebook.com/share/1a7zdx5xd6/" target="_blank"
           style="transition:transform .25s;" onmouseover="this.style.transform='scale(1.15)'" onmouseout="this.style.transform='scale(1)'">
           <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Facebook_Logo.png" alt="facebook"
               style="width:38px; height:38px; border-radius:50%; background:#0a0a0a; padding:5px; box-shadow:0 0 10px rgba(0,255,180,0.3);">
        </a>
      </div>
    </div>

    <div id="toast">teks berhasil disalin!</div>
  </div>

  <footer>
    <p>dibuat dengan ❤️ menggunakan <a href="https://gemini.google.com" target="_blank">gemini api</a> • © 2025</p>
  </footer>

  <script>
    // --- Helper function for getting elements by ID (case-sensitive fix) ---
    function getElementByIdFixed(id) {
        const element = document.getElementById(id);
        if (!element) {
            console.warn(`Element with ID '${id}' not found.`);
        }
        return element;
    }

    const toast = getElementByIdFixed('toast');
    const output = getElementByIdFixed('output');
    const previewImage = getElementByIdFixed('previewImage'); // Perbaiki ID
    const promptTemplate = getElementByIdFixed('prompt-template');
    const fileInput = getElementByIdFixed('image'); // Perbaiki ID
    const previewContainer = getElementByIdFixed('previewContainer'); // Perbaiki ID
    const removeBtn = getElementByIdFixed('removeBtn'); // Perbaiki ID
    const dropzone = getElementByIdFixed('dropzone');
    const generateBtn = getElementByIdFixed('generateBtn'); // Perbaiki ID
    const donateSection = getElementByIdFixed('donate'); // Dapatkan elemen donasi

    let currentFile = null; // menyimpan file yang diunggah
    let ketikIlustrasiTimeout; // Simpan ID timeout agar bisa dihentikan

    // === logika hide/show format output ===
    const typeRadios = document.querySelectorAll('input[name="type"]');
    const formatOptionsWrapper = getElementByIdFixed('format-options');
    const formatCards = formatOptionsWrapper.querySelectorAll('.option-card');
    const formatRadios = formatOptionsWrapper.querySelectorAll('input[name="format"]');

    function updateFormatVisibility() {
      const selectedType = document.querySelector('input[name="type"]:checked')?.value || 'general';

      formatCards.forEach(card => { // Gunakan forEach
        const format = card.dataset.format;
        const input = card.querySelector('input');

        card.classList.add('hidden'); // sembunyikan semua dulu
        input.checked = false; // batalkan pilihan sebelumnya

        if (selectedType === 'general') {
          if (['json', 'text'].includes(format)) {
            card.classList.remove('hidden');
            if (format === 'json') input.checked = true; // default ke json untuk general
          }
        } else if (selectedType === 'design') {
          if (['html', 'css'].includes(format)) {
            card.classList.remove('hidden');
            if (format === 'html') input.checked = true; // default ke html untuk design
          }
        } else if (selectedType === 'bug') {
          if (['text'].includes(format)) {
            card.classList.remove('hidden');
            if (format === 'text') input.checked = true; // default ke text untuk bug
          }
        }
      });
    }

    // jalankan saat load & saat ganti type
    typeRadios.forEach(radio => radio.addEventListener('change', updateFormatVisibility)); // Gunakan forEach
    updateFormatVisibility(); // panggil pertama kali saat halaman dimuat


    // reset isi awal
    output.textContent = "";

    // daftar ilustrasi teks
    const ilustrasiList = [
  '💡 Unggah gambar untuk menghasilkan deskripsi detail secara otomatis...',
  '🐞 Kirim tangkapan layar error untuk mendeteksi penyebab dan solusinya...',
  '🎨 Upload potongan desainmu dan ubah menjadi potongan kode website siap pakai...'
   ];

    // variabel global untuk kontrol urutan dan karakter
    let index = 0;
    let charIndex = 0;

    function ketikIlustrasi() {
      if (charIndex < ilustrasiList[index].length) {
        output.textContent += ilustrasiList[index].charAt(charIndex);
        charIndex++;
        ketikIlustrasiTimeout = setTimeout(ketikIlustrasi, 60); // Simpan ID timeout
      } else {
        ketikIlustrasiTimeout = setTimeout(() => { // Simpan ID timeout
          output.textContent = "";
          index = (index + 1) % ilustrasiList.length;
          charIndex = 0;
          ketikIlustrasi();
        }, 2000);
      }
    }

    // jalankan animasi
    ketikIlustrasi();
    
    // === toast & copy ===
    function showToast(message) { // Perbaiki nama fungsi
      toast.textContent = message;
      toast.style.top = `${window.scrollY + 25}px`; // Perbaiki scrolly menjadi scrollY
      toast.classList.add('show');
      clearTimeout(toast.hideTimeout); // Perbaiki cleartimeout dan hidetimeout
      toast.hideTimeout = setTimeout(() => toast.classList.remove('show'), 2200); // Perbaiki settimeout dan hidetimeout
    }

    window.addEventListener('scroll', () => {
      if (toast.classList.contains('show')) {
        toast.style.top = `${window.scrollY + 25}px`; // Perbaiki scrolly menjadi scrollY
      }
    });

    output.addEventListener('click', async () => {
      const text = output.textContent.trim();
      if (!text || text === "hasil akan muncul di sini..." || text === "memproses gambar, mohon tunggu...") return; // Tambahkan kondisi saat memproses
      try {
        await navigator.clipboard.writeText(text); // Perbaiki writetext
        showToast("teks berhasil disalin!"); // Perbaiki showtoast
      } catch (err) {
        console.error("gagal menyalin teks:", err);
        showToast("gagal menyalin teks!"); // Perbaiki showtoast
      }
    });

    // === upload & preview ===
    function showPreview(file) { // Perbaiki nama fungsi
      clearTimeout(ketikIlustrasiTimeout); // Hentikan animasi saat file di-upload
      output.textContent = 'hasil akan muncul di sini...'; // Reset output sebelum proses

      if (!file || !file.type.startsWith('image/')) { // Perbaiki startswith
        showToast('file yang diunggah harus berupa gambar.'); // Perbaiki showtoast
        return;
      }
      if (file.size > 3 * 1024 * 1024) { // batas 3mb
        showToast('ukuran gambar maksimal 3mb.'); // Perbaiki showtoast
        return;
      }

      currentFile = file; // simpan file yang valid
      const reader = new FileReader(); // Perbaiki FileReader
      reader.onload = e => {
        previewImage.src = e.target.result; // Perbaiki ID
        previewContainer.style.display = 'flex'; // Perbaiki ID
        dropzone.style.display = 'none'; // sembunyikan dropzone saat ada gambar
        donateSection.style.display = 'block'; // tampilkan donasi
      };
      reader.onerror = () => showToast('gagal membaca file gambar.'); // Perbaiki showtoast
      reader.readAsDataURL(file); // Perbaiki readasdataurl
    }

    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const file = e.dataTransfer?.files[0]; // Gunakan dataTransfer
      if (file) {
        fileInput.files = e.dataTransfer.files; // update file input
        showPreview(file); // Perbaiki showpreview
      }
    });

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) showPreview(file); // Perbaiki showpreview
    });

    removeBtn.addEventListener('click', () => { // Perbaiki ID
      previewContainer.style.display = 'none'; // Perbaiki ID
      previewImage.src = ''; // Perbaiki ID
      fileInput.value = ''; // reset input file
      currentFile = null; // hapus file yang tersimpan
      dropzone.style.display = 'flex'; // tampilkan kembali dropzone
      output.textContent = 'hasil akan muncul di sini...';
      donateSection.style.display = 'block'; // tampilkan donasi
      ketikIlustrasi(); // Mulai animasi lagi setelah menghapus gambar
    });

    // === send prompt ===
    generateBtn.addEventListener('click', async () => { // Perbaiki ID
      if (!currentFile) {
        output.textContent = 'mohon unggah gambar terlebih dahulu.';
        return;
      }

      const selectedType = document.querySelector('input[name="type"]:checked');
      const selectedFormat = document.querySelector('input[name="format"]:checked');

      if (!selectedType || !selectedFormat) {
        output.textContent = 'mohon pilih tipe prompt dan format output.';
        return;
      }

      // Tampilkan spinner dan nonaktifkan tombol
      generateBtn.disabled = true;
      generateBtn.innerHTML = '<span class="spinner"></span> Memproses...';
      output.textContent = 'memproses gambar, mohon tunggu...';
      donateSection.style.display = 'none'; // sembunyikan saat memproses

      try {
        const formData = new FormData(); // Perbaiki FormData
        let finalPrompt = '';

        // mengambil template prompt dari textarea
        let basePrompt = promptTemplate.value.trim(); // Perbaiki ID

        // logika pembuatan prompt berdasarkan tipe dan format
        if (selectedType.value === 'design') {
          if (selectedFormat.value === 'html') {
            finalPrompt = 'deteksi apakah gambar ini memuat elemen atau desain website. jika ya, buat ulang desain tersebut hanya dalam format css+html murni tanpa teks tambahan. jika tidak ada elemen website yang terdeteksi, balas dengan teks: "maaf, tidak ada desain html atau css yang terdeteksi."';
          } else { // css
            finalPrompt = 'analisis apakah gambar ini berisi tampilan antarmuka atau gaya desain website. jika ya, hasilkan hanya kode berupa tailwind template murni tanpa teks tambahan. jika tidak ada desain ui yang terdeteksi, balas dengan teks: "maaf, tidak ada desain html atau css yang terdeteksi."';
          }
        } else if (selectedType.value === 'bug') {
          finalPrompt = 'analisis gambar ini, deteksi jika ada kode error, pesan kesalahan, atau indikasi bug. jelaskan secara singkat penyebabnya dan solusi perbaikannya. jika gambar tidak berisi konteks bug atau error, jawab: "maaf, gambar ini tidak mengandung bug atau error yang dapat dianalisis."';
        } else { // general
          // ganti placeholder {format_placeholder} di prompt template
          const formatText = selectedFormat.value.toUpperCase(); // misalnya "JSON" atau "TEXT"
          finalPrompt = basePrompt.replace(/{format_placeholder}/g, formatText);
        }

        formData.append('prompt', finalPrompt);
        // Penting: Pastikan currentFile ada dan valid sebelum append
        if (currentFile) {
          formData.append('image', currentFile, currentFile.name); // gunakan currentFile yang valid
        } else {
          throw new Error("Tidak ada gambar yang diunggah untuk dikirim.");
        }


        const res = await fetch('/api/gemini', { method: 'POST', body: formData }); // Perbaiki method 'post'

        if (!res.ok) {
          const errorData = await res.json(); // Perbaiki errordata
          throw new Error(errorData.error || `server error: ${res.status}`); // Perbaiki error
        }

        const data = await res.json();

        let cleanResult = (data.result || data.error || 'Tidak ada hasil.')
  // Hapus blok markdown seperti ```json ... ```
  .replace(/```(json|html|css|text|TEXT)?\s*([\s\S]*?)```/gi, '$2')
  // Hapus penanda bold dan italic markdown
  .replace(/\*\*(.*?)\*\*/g, '$1')
  .replace(/\*(.*?)\*/g, '$1')
  .replace(/_(.*?)_/g, '$1')
  // Ganti bullet list agar tampil rapi
  .replace(/^\s*[-*+]\s*/gm, '• ')
  // Tambah jarak antar bagian utama (judul & paragraf)
  .replace(/([A-Z][A-Za-z ]+:)\n/g, '\n\n$1\n')
  // Hapus spasi berlebih dan baris kosong berurutan
  .replace(/\n{3,}/g, '\n\n')
  .replace(/^[ \t]+|[ \t]+$/gm, '')
  .trim();                                 
        
        output.textContent = cleanResult || 'tidak ada hasil.';
        
      } catch (err) {
        console.error("error saat mengirim prompt:", err);
        output.textContent = 'terjadi kesalahan: ' + err.message;
      } finally {
        // Selalu kembalikan tombol ke keadaan semula
        generateBtn.disabled = false;
        generateBtn.innerHTML = 'Generate Prompt';
        donateSection.style.display = 'block'; // tampilkan kembali donasi
      }
    });

    // Menghapus ikon SVG duplikat di JS karena sudah ada di HTML
    // const uploadBoxSvg = `
    //   <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image-up"><path d="M12 6V2"/><path d="M12 18V14"/><path d="M16 16 12 12 8 16"/><line x1="12" x2="12" y1="12" y2="21"/></svg>
    // `;
    // Pastikan SVG yang digunakan di header juga memiliki `stroke="currentColor"` atau `fill="currentColor"` agar warnanya bisa diatur via CSS.
    // Ini sudah diperbaiki di bagian HTML.
  </script>
</body>
</html>
